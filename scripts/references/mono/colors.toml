# Mono (greyscale dark) reference ramp.
# Used by scripts/generate-themes.py as the seed for the "mono" variant.
# Every slot is pure grey (r=g=b) so the generator treats them all as
# neutral - the per-slot chroma envelope collapses to ~0 and the
# variant's low c_cap keeps wallpaper-derived hues from rising above a
# faint tint. The accent / selection_background slots are the one
# exception: emit_slot bypasses c_cap for them so the wallpaper's most
# saturated color survives as a single point of color against the grey
# ramp.
mode = "dark"

accent = "#b8b8b8"
cursor = "#e8e8e8"
foreground = "#dcdcdc"
background = "#0f0f0f"
selection_foreground = "#0f0f0f"
selection_background = "#b8b8b8"

color0  = "#161616"
color1  = "#9a9a9a"
color2  = "#a4a4a4"
color3  = "#b0b0b0"
color4  = "#8e8e8e"
color5  = "#969696"
color6  = "#a0a0a0"
color7  = "#c8c8c8"
color8  = "#5e5e5e"
color9  = "#bcbcbc"
color10 = "#c4c4c4"
color11 = "#d0d0d0"
color12 = "#aeaeae"
color13 = "#b6b6b6"
color14 = "#c0c0c0"
color15 = "#f0f0f0"
