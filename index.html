<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wallpapers</title>
<style>
  :root {
    --bg: #0c0d10;
    --bg-elev: #14161b;
    --bg-elev-2: #1b1e25;
    --border: #262932;
    --text: #e7e9ee;
    --text-dim: #9aa0ab;
    --text-faint: #5f646f;
    --accent: #7aa2f7;
    --accent-soft: #7aa2f733;
    --danger: #f7768e;
    --ok: #9ece6a;
    --radius: 10px;
    --radius-sm: 6px;
    --font: ui-sans-serif, -apple-system, "Inter", "Segoe UI", Roboto, system-ui, sans-serif;
    --mono: ui-monospace, "JetBrains Mono", "Fira Code", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f7f7f8;
      --bg-elev: #ffffff;
      --bg-elev-2: #eef0f3;
      --border: #d8dbe0;
      --text: #1b1d22;
      --text-dim: #585d68;
      --text-faint: #9aa0ab;
      --accent: #3b6df0;
      --accent-soft: #3b6df022;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: var(--font); }
  body { min-height: 100vh; }
  a { color: inherit; }

  header {
    position: sticky; top: 0; z-index: 50;
    background: color-mix(in oklab, var(--bg) 88%, transparent);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--border);
  }
  .head-row {
    display: flex; align-items: center; gap: 14px;
    padding: 12px 18px;
    max-width: 1600px; margin: 0 auto;
  }
  .brand {
    font-weight: 700; letter-spacing: -0.01em; font-size: 15px;
    display: flex; align-items: baseline; gap: 8px;
  }
  .brand .count { color: var(--text-faint); font-weight: 500; font-size: 12px; font-family: var(--mono); }
  .search {
    flex: 1; max-width: 520px;
    position: relative;
  }
  .search input {
    width: 100%;
    background: var(--bg-elev);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 9px 12px 9px 34px;
    font-size: 13px;
    font-family: var(--font);
    outline: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); color: var(--text-faint); }
  .head-meta { color: var(--text-dim); font-size: 12px; font-family: var(--mono); margin-left: auto; }
  .head-meta button {
    background: none; border: 1px solid var(--border); color: var(--text-dim);
    border-radius: var(--radius-sm); padding: 6px 10px; font-family: var(--mono); font-size: 11px;
    cursor: pointer;
  }
  .head-meta button:hover { color: var(--text); border-color: var(--text-dim); }

  .filters {
    max-width: 1600px; margin: 0 auto;
    padding: 4px 18px 8px;
    display: flex; flex-direction: column; gap: 4px;
    border-bottom: 1px solid var(--border);
  }
  .frow {
    display: flex; flex-wrap: wrap; align-items: center; gap: 5px;
    padding: 2px 0;
  }
  .flabel {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-faint); width: 44px; flex-shrink: 0;
    font-family: var(--mono);
  }
  .chip {
    display: inline-flex; align-items: center; gap: 5px;
    padding: 3px 8px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    user-select: none;
    white-space: nowrap;
    flex-shrink: 0;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  .chip:hover { color: var(--text); border-color: var(--text-faint); }
  .chip.active {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--accent);
  }
  .chip.zero:not(.active) { opacity: 0.35; }
  .dd-item.zero:not(.selected) { opacity: 0.45; }
  .chip .dot { width: 8px; height: 8px; border-radius: 999px; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.15); }
  .chip .num { color: var(--text-faint); font-family: var(--mono); font-size: 9px; }
  .sep { width: 1px; height: 14px; background: var(--border); flex-shrink: 0; margin: 0 4px; }

  /* Dropdown */
  .dd { position: relative; }
  .dd-btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 8px 4px 10px;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: 999px;
    font-size: 11px;
    color: var(--text-dim);
    cursor: pointer;
    font-family: var(--font);
    white-space: nowrap;
    transition: border-color 0.12s, color 0.12s, background 0.12s;
  }
  .dd-btn:hover { color: var(--text); border-color: var(--text-faint); }
  .dd-btn.active {
    background: var(--accent-soft);
    color: var(--text);
    border-color: var(--accent);
  }
  .dd-btn .dd-label { font-family: var(--mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); }
  .dd-btn.active .dd-label { color: var(--text-dim); }
  .dd-btn .dd-val { font-weight: 500; }
  .dd-btn .dd-clear {
    display: none;
    width: 14px; height: 14px; border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--text);
    align-items: center; justify-content: center;
    font-size: 12px; line-height: 1;
    margin-left: 2px;
  }
  .dd-btn.active .dd-clear { display: inline-flex; }
  .dd-btn .dd-clear:hover { background: rgba(255,255,255,0.18); }
  .dd-btn .dd-caret { color: var(--text-faint); font-size: 9px; margin-left: 2px; }

  .dd-menu {
    position: absolute; top: calc(100% + 6px); left: 0;
    width: 260px; max-width: calc(100vw - 32px);
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 16px 40px rgba(0,0,0,0.4), 0 2px 6px rgba(0,0,0,0.2);
    z-index: 60;
    display: none;
    flex-direction: column;
    overflow: hidden;
  }
  .dd-menu.open { display: flex; }
  .dd-search {
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 9px 12px;
    background: transparent;
    color: var(--text);
    font-family: var(--font);
    font-size: 12px;
    outline: none;
  }
  .dd-list { max-height: 280px; overflow-y: auto; padding: 4px; }
  .dd-item {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px;
    padding: 6px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    font-size: 12px;
    color: var(--text);
  }
  .dd-item:hover { background: var(--bg-elev-2); }
  .dd-item.selected { background: var(--accent-soft); color: var(--text); }
  .dd-item .dd-item-count { font-family: var(--mono); font-size: 10px; color: var(--text-faint); }
  .dd-item.dd-any { color: var(--text-dim); font-style: italic; border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 4px; padding-bottom: 8px; }
  .dd-item.dd-any:hover { background: var(--bg-elev-2); font-style: italic; }
  .dd-empty { padding: 16px; text-align: center; color: var(--text-faint); font-size: 11px; font-family: var(--mono); }

  main {
    max-width: 1600px; margin: 0 auto;
    padding: 18px;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .card {
    position: relative;
    aspect-ratio: 16 / 10;
    background: var(--bg-elev);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    overflow: hidden;
    cursor: zoom-in;
    transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
  }
  .card:hover { transform: translateY(-2px); border-color: var(--text-faint); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
  .card img, .card video {
    width: 100%; height: 100%; object-fit: cover;
    display: block;
    opacity: 0; transition: opacity 0.3s;
  }
  .card img.loaded, .card video.loaded { opacity: 1; }
  .card .info {
    position: absolute; inset: auto 0 0 0;
    padding: 10px 12px 10px;
    background: linear-gradient(to top, rgba(0,0,0,0.78) 0%, rgba(0,0,0,0.35) 60%, transparent 100%);
    color: #fff;
    font-size: 12px;
    display: flex; align-items: flex-end; justify-content: space-between; gap: 8px;
    opacity: 0; transition: opacity 0.15s;
    pointer-events: none;
  }
  .card:hover .info { opacity: 1; }
  .card .title { font-weight: 600; line-height: 1.25; }
  .card .res { font-family: var(--mono); font-size: 10px; color: rgba(255,255,255,0.7); margin-top: 2px; }
  .card .badge {
    position: absolute; top: 8px; left: 8px;
    background: rgba(0,0,0,0.55); color: #fff;
    padding: 3px 7px; border-radius: var(--radius-sm);
    font-size: 10px; font-family: var(--mono); letter-spacing: 0.02em;
    backdrop-filter: blur(4px);
  }
  .card .swatches {
    position: absolute; top: 8px; right: 8px;
    display: flex; gap: 2px;
    opacity: 0; transition: opacity 0.15s;
  }
  .card:hover .swatches { opacity: 1; }
  .card .sw {
    width: 10px; height: 10px;
    border-radius: 2px;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.2);
  }

  .empty {
    grid-column: 1 / -1;
    padding: 80px 20px;
    text-align: center;
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
  }
  .empty code { background: var(--bg-elev-2); padding: 4px 8px; border-radius: 4px; color: var(--text); }
  .sentinel { grid-column: 1 / -1; height: 1px; }

  .lb {
    position: fixed; inset: 0;
    background: rgba(8, 9, 12, 0.92);
    z-index: 100;
    display: none;
    align-items: stretch;
  }
  .lb.open { display: flex; }
  .lb-image-wrap {
    flex: 1;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
    min-width: 0;
  }
  .lb-image-wrap img, .lb-image-wrap video {
    max-width: 100%; max-height: 100%;
    object-fit: contain;
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    background: #000;
  }
  .lb-side {
    width: 360px;
    background: var(--bg-elev);
    border-left: 1px solid var(--border);
    padding: 22px;
    overflow-y: auto;
    display: flex; flex-direction: column; gap: 18px;
  }
  .lb-close {
    position: absolute; top: 14px; right: 14px;
    width: 32px; height: 32px; border-radius: 999px;
    background: rgba(0,0,0,0.4);
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
    z-index: 1;
  }
  .lb-close:hover { background: rgba(0,0,0,0.7); }
  .lb-title { font-size: 18px; font-weight: 700; line-height: 1.25; word-break: break-word; }
  .lb-path {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-faint);
    word-break: break-all;
    padding: 8px 10px;
    background: var(--bg-elev-2);
    border-radius: var(--radius-sm);
    border: 1px solid var(--border);
  }
  .lb-desc { color: var(--text-dim); font-size: 13px; line-height: 1.55; }
  .lb-section { display: flex; flex-direction: column; gap: 8px; }
  .lb-sec-label { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-faint); font-family: var(--mono); }
  .tags { display: flex; flex-wrap: wrap; gap: 5px; }
  .tag {
    font-size: 11px; padding: 3px 8px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-dim);
    font-family: var(--mono);
  }
  .palette {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 4px;
  }
  .palette .p {
    aspect-ratio: 1;
    border-radius: var(--radius-sm);
    cursor: pointer;
    position: relative;
    box-shadow: inset 0 0 0 1px rgba(255,255,255,0.06);
  }
  .palette .p:hover::after {
    content: attr(data-hex);
    position: absolute; bottom: -22px; left: 50%; transform: translateX(-50%);
    font-family: var(--mono); font-size: 10px;
    color: var(--text); background: var(--bg-elev-2);
    padding: 2px 5px; border-radius: 3px;
    border: 1px solid var(--border);
    white-space: nowrap;
    pointer-events: none;
    z-index: 1;
  }
  .kv { display: grid; grid-template-columns: 60px 1fr; gap: 6px 12px; font-size: 12px; margin: 0; }
  .kv dt { color: var(--text-faint); font-family: var(--mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; padding-top: 2px; }
  .kv dd { margin: 0; color: var(--text); word-break: break-word; }
  .lb-actions { display: flex; gap: 8px; margin-top: auto; padding-top: 12px; border-top: 1px solid var(--border); }
  .btn {
    flex: 1; padding: 9px 12px;
    background: var(--bg-elev-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    font-family: var(--font);
    font-size: 12px;
    cursor: pointer;
    text-align: center;
    text-decoration: none;
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .btn.primary:hover { filter: brightness(1.08); }

  @media (max-width: 760px) {
    .lb { flex-direction: column; }
    .lb-side { width: auto; max-height: 50vh; border-left: none; border-top: 1px solid var(--border); }
    .flabel { width: 44px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 8px; }
    .head-meta { display: none; }
  }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); }

  .loader {
    position: fixed; inset: 0;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    background: var(--bg);
    z-index: 200;
    transition: opacity 0.3s ease, visibility 0.3s ease;
  }
  .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-spinner {
    width: 28px; height: 28px;
    border: 2.5px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: lspin 0.8s linear infinite;
  }
  .loader-text {
    font-family: var(--mono); font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  @keyframes lspin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="loading" class="loader">
  <div class="loader-spinner"></div>
  <div class="loader-text">loading wallpapers</div>
</div>

<header>
  <div class="head-row">
    <div class="brand">Wallpapers <span class="count" id="count">loading...</span></div>
    <div class="search">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="Search title, theme, tags, path...">
    </div>
    <div class="head-meta">
      <button id="reset">reset</button>
    </div>
  </div>
  <div class="filters" id="filters"></div>
</header>

<main>
  <div class="grid" id="grid"></div>
</main>

<div class="lb" id="lb" role="dialog" aria-modal="true">
  <button class="lb-close" id="lbclose" title="Close (esc)">&times;</button>
  <div class="lb-image-wrap"></div>
  <aside class="lb-side" id="lbside"></aside>
</div>

<script src="wallpapers.js"></script>
<script src="live.js"></script>
<script>
const COLOR_DOTS = {
  red:        '#e74c5b',
  orange:     '#f5994f',
  yellow:     '#f0d869',
  green:      '#7bbf6f',
  cyan:       '#5ec3d0',
  blue:       '#6d8fee',
  purple:     '#a87cd9',
  pink:       '#e88abf',
  monochrome: '#9aa0ab',
};

const TONE_DOTS = {
  dark:  '#1b1e25',
  light: '#e7e9ee',
  live:  '#f5994f',
};

const VIDEO_RE = /\.(mp4|webm|mov)$/i;

const STATE = {
  entries: [],
  byPath: {},
  filtered: [],
  filters: { tone: null, color: null, scheme: null, theme: null, resolution: null, q: '' },
  facetCounts: {},
  rendered: 0,
  pageSize: 80,
};

const FILTER_KEYS = ['tone','color','scheme','theme','resolution'];

function readUrl() {
  const sp = new URLSearchParams(location.search);
  for (const k of FILTER_KEYS) STATE.filters[k] = sp.get(k) || null;
  STATE.filters.q = sp.get('q') || '';
}

function buildUrl({ withHash = true } = {}) {
  const sp = new URLSearchParams();
  for (const k of FILTER_KEYS) if (STATE.filters[k]) sp.set(k, STATE.filters[k]);
  if (STATE.filters.q) sp.set('q', STATE.filters.q);
  const qs = sp.toString();
  const hash = withHash ? location.hash : '';
  return location.pathname + (qs ? '?' + qs : '') + hash;
}

function writeUrl() {
  history.replaceState(null, '', buildUrl());
}

function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
function decodeHashPath() {
  if (!location.hash) return null;
  try { return decodeURIComponent(location.hash.slice(1)); }
  catch { return null; }
}

const $ = (s) => document.querySelector(s);
const grid = $('#grid');
const filtersEl = $('#filters');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }

function parseRes(path) {
  const name = path.split('/').pop();
  const m = name.match(/^(\d+)x(\d+)_/);
  return m ? `${m[1]}x${m[2]}` : '';
}

function resOf(path, m) {
  if (m && m.width && m.height) return `${m.width}x${m.height}`;
  return parseRes(path);
}

function dimsOf(path, m) {
  if (m && m.width && m.height) return [m.width, m.height];
  const r = parseRes(path);
  if (!r) return [null, null];
  const [w, h] = r.split('x').map(Number);
  return [w, h];
}

const RES_TIERS = ['<=720p','720p','1080p','1440p','4K','5K','8K+'];

function bucketRes(w, h) {
  if (!w || !h) return null;
  if (w >= 7000) return '8K+';
  if (w >= 4800) return '5K';
  if (w >= 3500) return '4K';
  if (w >= 2500) return '1440p';
  if (w >= 1900) return '1080p';
  if (w >= 1200) return '720p';
  return '<=720p';
}

function fmtBytes(n) {
  if (!n || n <= 0) return '';
  const u = ['B','KB','MB','GB'];
  let i = 0; let v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v < 10 ? v.toFixed(1) : Math.round(v)} ${u[i]}`;
}

const MEDIA_BASE = (window.WALLPAPERS_BASE_URL || '').replace(/\/+$/, '');
function mediaUrl(p) {
  if (!p) return p;
  if (/^(https?:|data:|blob:)/i.test(p)) return p;
  return MEDIA_BASE ? `${MEDIA_BASE}/${p.replace(/^\/+/, '')}` : p;
}

async function fetchJsonOrEmpty(url) {
  try {
    const res = await fetch(url);
    if (!res.ok) return {};
    return await res.json();
  } catch { return {}; }
}

async function load() {
  let data, live;
  if (window.WALLPAPERS) {
    data = window.WALLPAPERS;
    live = window.LIVE || {};
  } else {
    const main = await fetch('wallpapers.json');
    if (!main.ok) throw new Error('HTTP ' + main.status);
    data = await main.json();
    live = await fetchJsonOrEmpty('live.json');
  }
  const merged = { ...data, ...live };
  for (const [path, m] of Object.entries(merged)) {
    const [w, h] = dimsOf(path, m);
    m._resTier = bucketRes(w, h);
  }
  STATE.entries = Object.entries(merged);
  STATE.byPath = merged;
  $('#count').textContent = STATE.entries.length.toLocaleString() + ' images';

  readUrl();
  $('#q').value = STATE.filters.q || '';
  buildFilters();
  applyFilters({ writeUrl: false });

  const hashPath = decodeHashPath();
  if (hashPath && STATE.byPath[hashPath]) {
    openLightbox(hashPath, STATE.byPath[hashPath], { push: false });
  }
}

function buildFilters() {
  const tones = new Map(), colors = new Map(), schemes = new Map(), themes = new Map(), resolutions = new Map();
  for (const [, m] of STATE.entries) {
    inc(tones, m.tone);
    inc(colors, m.color);
    inc(schemes, m.scheme);
    inc(themes, m.theme);
    inc(resolutions, m._resTier);
  }

  filtersEl.replaceChildren();
  const colorOrder = ['monochrome','red','orange','yellow','green','cyan','blue','purple','pink'];
  const toneItems  = ['dark','light','live'].filter(t => tones.has(t)).map(t => ['tone', t, tones.get(t)]);
  const colorItems = colorOrder.filter(c => colors.has(c)).map(c => ['color', c, colors.get(c)]);

  const row = el('div', 'frow');
  row.appendChild(el('div', 'flabel', 'filter'));
  toneItems.forEach(([k, v, c]) => row.appendChild(chipEl(k, v, c)));
  row.appendChild(el('span', 'sep'));
  colorItems.forEach(([k, v, c]) => row.appendChild(chipEl(k, v, c)));
  row.appendChild(el('span', 'sep'));
  row.appendChild(dropdownEl('resolution', resolutions, RES_TIERS.filter(t => resolutions.has(t))));
  row.appendChild(dropdownEl('scheme', schemes));
  row.appendChild(dropdownEl('theme',  themes));
  filtersEl.appendChild(row);
}

function inc(m, k) { if (!k) return; m.set(k, (m.get(k) || 0) + 1); }
function sortedKeys(m) { return [...m.entries()].sort((a,b) => b[1] - a[1]).map(([k]) => k); }

function facetField(m, key) { return key === 'resolution' ? m._resTier : m[key]; }

function computeFacetCounts() {
  const f = STATE.filters;
  const q = f.q.trim().toLowerCase();
  const out = { tone: {}, color: {}, scheme: {}, theme: {}, resolution: {} };
  for (const [path, m] of STATE.entries) {
    if (q) {
      const hay = (path + ' ' + (m.title||'') + ' ' + (m.description||'') + ' ' + (m.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(q)) continue;
    }
    for (const k of FILTER_KEYS) {
      let match = true;
      for (const k2 of FILTER_KEYS) {
        if (k2 === k) continue;
        if (f[k2] && facetField(m, k2) !== f[k2]) { match = false; break; }
      }
      if (!match) continue;
      const v = facetField(m, k);
      if (!v) continue;
      out[k][v] = (out[k][v] || 0) + 1;
    }
  }
  return out;
}

function updateFacetUI() {
  for (const chip of filtersEl.querySelectorAll('.chip')) {
    const k = chip.dataset.filter, v = chip.dataset.value;
    const c = (STATE.facetCounts[k] || {})[v] || 0;
    const num = chip.querySelector('.num');
    if (num) num.textContent = String(c);
    chip.classList.toggle('zero', c === 0);
  }
}

function chipEl(filterKey, value, count) {
  const chip = el('div', 'chip');
  chip.dataset.filter = filterKey;
  chip.dataset.value = value;
  if (filterKey === 'color' || (filterKey === 'tone' && value === 'live')) {
    const dot = el('span', 'dot');
    dot.style.background = COLOR_DOTS[value] || TONE_DOTS[value] || '#999';
    chip.appendChild(dot);
  }
  chip.appendChild(el('span', null, value));
  chip.appendChild(el('span', 'num', String(count)));
  chip.addEventListener('click', () => toggleFilter(filterKey, value));
  return chip;
}

function rowEl(label, keys, counts, filterKey) {
  const row = el('div', 'frow');
  row.appendChild(el('div', 'flabel', label));
  for (const k of keys) row.appendChild(chipEl(filterKey, k, counts.get(k)));
  return row;
}

function dropdownEl(filterKey, counts, orderedItems) {
  const items = orderedItems || sortedKeys(counts);

  const wrap = el('div', 'dd');

  const btn = el('button', 'dd-btn');
  btn.type = 'button';
  const lab = el('span', 'dd-label', filterKey);
  const val = el('span', 'dd-val', 'all');
  const clr = el('span', 'dd-clear', '×');
  clr.title = 'clear';
  const caret = el('span', 'dd-caret', '▾');
  btn.append(lab, val, clr, caret);

  const menu = el('div', 'dd-menu');
  const search = document.createElement('input');
  search.type = 'search';
  search.className = 'dd-search';
  search.placeholder = `Search ${filterKey}...`;
  const list = el('div', 'dd-list');
  menu.append(search, list);

  function refresh(query = '') {
    list.replaceChildren();
    const q = query.trim().toLowerCase();

    const anyItem = el('div', 'dd-item dd-any', `any ${filterKey}`);
    anyItem.addEventListener('click', () => {
      STATE.filters[filterKey] = null;
      close();
      paintBtn();
      applyFilters();
    });
    list.appendChild(anyItem);

    const live = STATE.facetCounts[filterKey] || {};
    const filtered = items.filter(k => !q || k.toLowerCase().includes(q));
    if (filtered.length === 0) {
      list.appendChild(el('div', 'dd-empty', 'no matches'));
      return;
    }
    for (const k of filtered) {
      const c = live[k] || 0;
      const item = el('div', 'dd-item');
      if (STATE.filters[filterKey] === k) item.classList.add('selected');
      if (c === 0) item.classList.add('zero');
      item.appendChild(el('span', null, k));
      item.appendChild(el('span', 'dd-item-count', String(c)));
      item.addEventListener('click', () => {
        STATE.filters[filterKey] = k;
        close();
        paintBtn();
        applyFilters();
      });
      list.appendChild(item);
    }
  }

  function paintBtn() {
    const current = STATE.filters[filterKey];
    if (current) { btn.classList.add('active'); val.textContent = current; }
    else { btn.classList.remove('active'); val.textContent = 'all'; }
  }

  function open() {
    document.querySelectorAll('.dd-menu.open').forEach(m => m !== menu && m.classList.remove('open'));
    menu.classList.add('open');
    refresh(search.value);
    setTimeout(() => search.focus(), 0);
  }
  function close() { menu.classList.remove('open'); }

  btn.addEventListener('click', (e) => {
    e.stopPropagation();
    if (e.target === clr || clr.contains(e.target)) {
      STATE.filters[filterKey] = null;
      paintBtn();
      applyFilters();
      return;
    }
    menu.classList.contains('open') ? close() : open();
  });
  menu.addEventListener('click', (e) => e.stopPropagation());
  search.addEventListener('input', () => refresh(search.value));
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter') {
      const first = list.querySelector('.dd-item:not(.dd-any)');
      if (first) first.click();
    }
  });

  wrap.append(btn, menu);
  paintBtn();
  return wrap;
}

document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.dd')) {
    document.querySelectorAll('.dd-menu.open').forEach(m => m.classList.remove('open'));
  }
});

function toggleFilter(key, val) {
  STATE.filters[key] = STATE.filters[key] === val ? null : val;
  syncChipState();
  applyFilters();
}

function syncChipState() {
  for (const chip of filtersEl.querySelectorAll('.chip')) {
    const k = chip.dataset.filter, v = chip.dataset.value;
    chip.classList.toggle('active', STATE.filters[k] === v);
  }
}

function applyFilters(opts = {}) {
  const f = STATE.filters;
  const q = f.q.trim().toLowerCase();
  STATE.filtered = STATE.entries.filter(([path, m]) => {
    if (f.tone   && m.tone   !== f.tone)   return false;
    if (f.color  && m.color  !== f.color)  return false;
    if (f.scheme && m.scheme !== f.scheme) return false;
    if (f.theme  && m.theme  !== f.theme)  return false;
    if (f.resolution && m._resTier !== f.resolution) return false;
    if (q) {
      const hay = (path + ' ' + (m.title||'') + ' ' + (m.description||'') + ' ' + (m.tags||[]).join(' ')).toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
  $('#count').textContent = `${STATE.filtered.length.toLocaleString()} / ${STATE.entries.length.toLocaleString()}`;
  STATE.rendered = 0;
  grid.replaceChildren();
  renderMore();
  STATE.facetCounts = computeFacetCounts();
  updateFacetUI();
  if (opts.writeUrl !== false) writeUrl();
}

const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting && e.target.dataset.src) {
      const img = e.target;
      img.src = img.dataset.src;
      img.removeAttribute('data-src');
      io.unobserve(img);
    }
  }
}, { rootMargin: '300px' });

const sentinelIo = new IntersectionObserver((entries) => {
  if (entries[0].isIntersecting) renderMore();
}, { rootMargin: '600px' });

function renderMore() {
  if (STATE.rendered === 0 && STATE.filtered.length === 0) {
    const empty = el('div', 'empty', 'No matches. Try clearing a filter.');
    grid.appendChild(empty);
    return;
  }
  const oldSentinel = grid.querySelector('.sentinel');
  if (oldSentinel) oldSentinel.remove();

  const end = Math.min(STATE.filtered.length, STATE.rendered + STATE.pageSize);
  const frag = document.createDocumentFragment();
  for (let i = STATE.rendered; i < end; i++) {
    frag.appendChild(cardEl(STATE.filtered[i]));
  }
  STATE.rendered = end;

  if (end < STATE.filtered.length) {
    const sentinel = el('div', 'sentinel');
    frag.appendChild(sentinel);
    grid.appendChild(frag);
    sentinelIo.disconnect();
    sentinelIo.observe(sentinel);
  } else {
    grid.appendChild(frag);
  }
}

function cardEl([path, m]) {
  const card = el('div', 'card');
  card.title = m.title || path;

  const isVideo = VIDEO_RE.test(path);
  let media;
  if (isVideo) {
    media = document.createElement('video');
    media.muted = true; media.loop = true; media.playsInline = true;
    media.preload = 'metadata';
    media.dataset.src = mediaUrl(path);
    media.addEventListener('loadeddata', () => media.classList.add('loaded'));
    card.addEventListener('mouseenter', () => media.play().catch(() => {}));
    card.addEventListener('mouseleave', () => { media.pause(); media.currentTime = 0; });
  } else {
    media = document.createElement('img');
    media.alt = m.title || '';
    media.loading = 'lazy';
    media.dataset.src = mediaUrl(m.thumb_path || path);
    media.addEventListener('load', () => media.classList.add('loaded'));
  }
  io.observe(media);
  card.appendChild(media);

  card.appendChild(el('div', 'badge', `${m.tone || ''} ${m.color || ''}`.trim()));

  if (m.colors && m.colors.length) {
    const sw = el('div', 'swatches');
    m.colors.slice(0, 6).forEach(c => {
      const s = el('span', 'sw');
      s.style.background = c;
      sw.appendChild(s);
    });
    card.appendChild(sw);
  }

  const info = el('div', 'info');
  const left = el('div');
  left.appendChild(el('div', 'title', m.title || path.split('/').pop()));
  const resLine = `${resOf(path, m)}${m.scheme ? '  ·  ' + m.scheme : ''}`;
  left.appendChild(el('div', 'res', resLine));
  info.appendChild(left);
  card.appendChild(info);

  card.addEventListener('click', () => openLightbox(path, m));
  return card;
}

const lb = $('#lb');
const lbSide = $('#lbside');

function openLightbox(path, m, opts = {}) {
  const wrap = document.querySelector('.lb-image-wrap');
  wrap.replaceChildren();
  let media;
  if (VIDEO_RE.test(path)) {
    media = document.createElement('video');
    media.src = mediaUrl(path);
    media.controls = true;
    media.autoplay = true;
    media.loop = true;
    media.muted = true;
    media.playsInline = true;
  } else {
    media = document.createElement('img');
    media.src = mediaUrl(m.medium_path || path);
    media.alt = m.title || path;
  }
  media.id = 'lbimg';
  wrap.appendChild(media);
  renderSide(path, m);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';

  if (opts.push !== false) {
    const newUrl = buildUrl({ withHash: false }) + '#' + encodePath(path);
    history.pushState({ lightbox: path }, '', newUrl);
  }
}

function flash(target) {
  const orig = target.style.boxShadow;
  target.style.boxShadow = 'inset 0 0 0 2px #fff, 0 0 0 2px var(--accent)';
  setTimeout(() => target.style.boxShadow = orig, 250);
}

function renderSide(path, m) {
  lbSide.replaceChildren();

  lbSide.appendChild(el('div', 'lb-title', m.title || path.split('/').pop()));
  lbSide.appendChild(el('div', 'lb-path', path));

  if (m.description) lbSide.appendChild(el('div', 'lb-desc', m.description));

  const kv = el('dl', 'kv');
  const rows = [
    ['res',    resOf(path, m)],
    ['size',   fmtBytes(m.size_bytes)],
    ['tone',   m.tone],
    ['color',  m.color],
    ['theme',  m.theme],
    ['scheme', m.scheme],
  ];
  for (const [k, v] of rows) {
    if (!v) continue;
    kv.appendChild(el('dt', null, k));
    kv.appendChild(el('dd', null, v));
  }
  lbSide.appendChild(kv);

  if (m.tags && m.tags.length) {
    const sec = el('div', 'lb-section');
    sec.appendChild(el('div', 'lb-sec-label', 'tags'));
    const wrap = el('div', 'tags');
    m.tags.forEach(t => wrap.appendChild(el('span', 'tag', t)));
    sec.appendChild(wrap);
    lbSide.appendChild(sec);
  }

  if (m.colors && m.colors.length) {
    const sec = el('div', 'lb-section');
    sec.appendChild(el('div', 'lb-sec-label', 'palette (click to copy)'));
    const pal = el('div', 'palette');
    m.colors.forEach(c => {
      const p = el('div', 'p');
      p.style.background = c;
      p.dataset.hex = c;
      p.title = c;
      p.addEventListener('click', () => {
        if (navigator.clipboard) navigator.clipboard.writeText(c).catch(() => {});
        flash(p);
      });
      pal.appendChild(p);
    });
    sec.appendChild(pal);
    lbSide.appendChild(sec);
  }

  const actions = el('div', 'lb-actions');
  const dl = el('a', 'btn', 'download');
  dl.href = mediaUrl(path); dl.setAttribute('download', '');
  const open = el('a', 'btn primary', 'open full');
  open.href = mediaUrl(path); open.target = '_blank'; open.rel = 'noopener';
  actions.appendChild(dl); actions.appendChild(open);
  lbSide.appendChild(actions);
}

function closeLightbox(opts = {}) {
  if (!lb.classList.contains('open')) return;
  lb.classList.remove('open');
  const wrap = document.querySelector('.lb-image-wrap');
  wrap.replaceChildren();
  document.body.style.overflow = '';

  if (opts.pop !== false && history.state && history.state.lightbox) {
    history.back();
  } else if (opts.pop !== false && location.hash) {
    history.replaceState(null, '', buildUrl({ withHash: false }));
  }
}
$('#lbclose').addEventListener('click', () => closeLightbox());
lb.addEventListener('click', (e) => { if (e.target === lb || e.target.classList.contains('lb-image-wrap')) closeLightbox(); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && lb.classList.contains('open')) closeLightbox(); });

window.addEventListener('popstate', () => {
  readUrl();
  $('#q').value = STATE.filters.q || '';
  buildFilters();
  applyFilters({ writeUrl: false });

  const hashPath = decodeHashPath();
  const isOpen = lb.classList.contains('open');
  if (hashPath && STATE.byPath[hashPath]) {
    if (!isOpen) openLightbox(hashPath, STATE.byPath[hashPath], { push: false });
  } else if (isOpen) {
    closeLightbox({ pop: false });
  }
});

$('#q').addEventListener('input', debounce((e) => {
  STATE.filters.q = e.target.value;
  applyFilters();
}, 120));

$('#reset').addEventListener('click', () => {
  STATE.filters = { tone: null, color: null, scheme: null, theme: null, resolution: null, q: '' };
  $('#q').value = '';
  buildFilters();
  applyFilters();
});

function showLoadError(err) {
  grid.replaceChildren();
  const wrap = el('div', 'empty');
  wrap.appendChild(el('div', null, 'Could not load wallpapers.json.'));
  wrap.appendChild(el('div', null, ' '));
  wrap.appendChild(el('div', null, 'Opening this file directly with file:// blocks fetch().'));
  wrap.appendChild(el('div', null, 'Serve the folder instead:'));
  wrap.appendChild(el('div', null, ' '));
  const code = el('code', null, 'python3 -m http.server');
  wrap.appendChild(code);
  wrap.appendChild(el('div', null, ' '));
  wrap.appendChild(el('div', null, 'then open http://localhost:8000'));
  wrap.appendChild(el('div', null, ' '));
  wrap.appendChild(el('div', null, 'Error: ' + (err && err.message || String(err))));
  grid.appendChild(wrap);
}

function hideLoader() {
  const loader = document.getElementById('loading');
  if (loader) loader.classList.add('hidden');
}

load().then(hideLoader).catch(err => { hideLoader(); showLoadError(err); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err));
  });
}
</script>
</body>
