<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>wallpapers</title>
<meta name="description" content="A browsable index of high-resolution wallpapers, organized like a workspace.">
<script>try{var t=localStorage.getItem('wp-theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t;}catch(e){}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* =========================================================================
     IDE / Editor theme. The folder tree IS the data model (dark/blue/...);
     active filters are editor tabs; search is a Cmd-P find; a status bar
     carries the counts. Primer-inspired tokens, verified WCAG-AA.
     ========================================================================= */
  :root {
    --font-ui: "IBM Plex Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-mono: "IBM Plex Mono", ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;

    /* Dark */
    --bg:          #0d1117;   /* editor */
    --bg-side:     #090c10;   /* sidebar / activity / status */
    --bg-elev:     #161b22;   /* cards, dropdowns, panels */
    --bg-hover:    #1c2128;
    --bg-sel:      rgba(68,147,248,0.14);
    --border:      #21262d;
    --border-2:    #30363d;
    --text:        #e6edf3;
    --text-dim:    #8b949e;
    --text-faint:  #7d8590;
    --accent:      #4493f8;
    --accent-2:    #58a6ff;
    --accent-soft: rgba(68,147,248,0.15);
    --green:       #3fb950;
    --shadow:      0 10px 30px -8px rgba(1,4,9,0.6);
    color-scheme: dark;

    --activity-w: 48px;
    --side-w: 264px;
    --topbar-h: 40px;
    --status-h: 28px;
    --radius: 6px;
    --radius-sm: 4px;

    --ease: cubic-bezier(0.2, 0.6, 0.2, 1);
    --t-fast: 130ms;
    --t-med: 200ms;
    --t-img: 460ms;

    --dot-monochrome:#8b949e; --dot-red:#f85149; --dot-orange:#db8e3c; --dot-yellow:#d6b73c;
    --dot-green:#3fb950; --dot-cyan:#39c5cf; --dot-blue:#4493f8; --dot-purple:#a371f7; --dot-pink:#db61a2;
  }
  :root[data-theme="light"] {
    --bg:#ffffff; --bg-side:#f6f8fa; --bg-elev:#ffffff; --bg-hover:#eaeef2;
    --bg-sel: rgba(9,105,218,0.10);
    --border:#d1d9e0; --border-2:#afb8c1;
    --text:#1f2328; --text-dim:#656d76; --text-faint:#66707a;
    --accent:#0969da; --accent-2:#0969da; --accent-soft: rgba(9,105,218,0.10);
    --green:#1a7f37; --shadow: 0 10px 30px -10px rgba(31,35,40,0.18);
    color-scheme: light;
    --dot-monochrome:#6e7781; --dot-red:#cf222e; --dot-orange:#bc4c00; --dot-yellow:#9a6700;
    --dot-green:#1a7f37; --dot-cyan:#1b7c83; --dot-blue:#0969da; --dot-purple:#8250df; --dot-pink:#bf3989;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg:#ffffff; --bg-side:#f6f8fa; --bg-elev:#ffffff; --bg-hover:#eaeef2;
      --bg-sel: rgba(9,105,218,0.10);
      --border:#d1d9e0; --border-2:#afb8c1;
      --text:#1f2328; --text-dim:#656d76; --text-faint:#66707a;
      --accent:#0969da; --accent-2:#0969da; --accent-soft: rgba(9,105,218,0.10);
      --green:#1a7f37; --shadow: 0 10px 30px -10px rgba(31,35,40,0.18);
      color-scheme: light;
      --dot-monochrome:#6e7781; --dot-red:#cf222e; --dot-orange:#bc4c00; --dot-yellow:#9a6700;
      --dot-green:#1a7f37; --dot-cyan:#1b7c83; --dot-blue:#0969da; --dot-purple:#8250df; --dot-pink:#bf3989;
    }
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--text);
    font-family: var(--font-ui); font-size: 13px;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow: hidden; }
  a { color: var(--accent); text-decoration: none; }
  .mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: -1px; border-radius: 2px; }
  :focus:not(:focus-visible) { outline: none; }

  /* ---------- App shell ---------- */
  .app { display: flex; height: calc(100vh - var(--status-h)); height: calc(100dvh - var(--status-h)); }

  .activity {
    width: var(--activity-w); flex-shrink: 0;
    background: var(--bg-side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; align-items: center;
    padding: 8px 0; gap: 4px;
  }
  .act-btn {
    width: 40px; height: 40px; border: none; background: none; cursor: pointer;
    color: var(--text-faint); border-radius: var(--radius-sm);
    display: flex; align-items: center; justify-content: center;
    position: relative; transition: color var(--t-fast) var(--ease);
  }
  .act-btn:hover { color: var(--text); }
  .act-btn.on { color: var(--text); }
  .act-btn.on::before {
    content: ""; position: absolute; left: -8px; top: 8px; bottom: 8px; width: 2px;
    background: var(--accent); border-radius: 2px;
  }
  .act-btn svg { width: 22px; height: 22px; }
  .act-spacer { flex: 1; }

  .sidebar {
    width: var(--side-w); flex-shrink: 0;
    background: var(--bg-side); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; min-height: 0;
  }
  .app:not(.side-open) .sidebar { display: none; }
  .side-head {
    height: var(--topbar-h); flex-shrink: 0;
    display: flex; align-items: center; gap: 8px;
    padding: 0 14px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-faint);
  }
  .tree { flex: 1; overflow-y: auto; padding: 4px 0 10px; min-height: 0; }
  .tree-folder, .tree-leaf {
    display: flex; align-items: center; gap: 7px;
    padding: 3px 14px 3px 12px; cursor: pointer; user-select: none;
    position: relative; color: var(--text-dim); white-space: nowrap;
    transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .tree-leaf { padding-left: 30px; }
  .tree-folder:hover, .tree-leaf:hover { background: var(--bg-hover); color: var(--text); }
  .tree-folder.active, .tree-leaf.active { background: var(--bg-sel); color: var(--text); }
  .tree-folder.active::before, .tree-leaf.active::before {
    content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 2px; background: var(--accent);
  }
  .tree-folder.zero, .tree-leaf.zero { opacity: 0.34; }
  .tree-caret {
    width: 12px; font-size: 9px; color: var(--text-faint); flex-shrink: 0;
    transition: transform var(--t-fast) var(--ease);
  }
  .tree-folder.collapsed .tree-caret { transform: rotate(-90deg); }
  .tree-ico { width: 15px; height: 15px; flex-shrink: 0; color: var(--text-faint); display: inline-flex; }
  .tree-ico svg { width: 15px; height: 15px; }
  .tree-dot { width: 9px; height: 9px; border-radius: 2px; flex-shrink: 0;
    box-shadow: inset 0 0 0 1px rgba(127,127,127,0.25); }
  .tree-name { flex: 1; overflow: hidden; text-overflow: ellipsis; }
  .tree-leaf .tree-name { font-family: var(--font-mono); font-size: 12px; }
  .tree-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .tree-kids.hidden { display: none; }

  /* Sidebar FILTERS section (pinned) */
  .side-filters { flex-shrink: 0; border-top: 1px solid var(--border); padding: 6px 0 8px; }
  .side-sec {
    padding: 6px 14px 4px;
    font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.08em;
    text-transform: uppercase; color: var(--text-faint);
  }

  .dd { position: relative; }
  .dd-btn {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 5px 14px; background: none; border: none; cursor: pointer;
    color: var(--text-dim); font-family: var(--font-ui); font-size: 12.5px;
    text-align: left; transition: color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .dd-btn:hover { background: var(--bg-hover); color: var(--text); }
  .dd-btn .dd-label {
    font-family: var(--font-mono); font-size: 11px; color: var(--text-faint);
    width: 74px; flex-shrink: 0; text-transform: lowercase;
  }
  .dd-btn .dd-val { flex: 1; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .dd-btn.active .dd-val { color: var(--accent-2); }
  .dd-btn .dd-caret { color: var(--text-faint); font-size: 8px; flex-shrink: 0; }
  .dd-menu {
    position: absolute; left: 8px; bottom: calc(100% + 4px);
    width: 240px; max-width: calc(100vw - 24px);
    background: var(--bg-elev); border: 1px solid var(--border-2);
    border-radius: var(--radius); box-shadow: var(--shadow);
    z-index: 70; display: none; flex-direction: column; overflow: hidden;
  }
  .dd-menu.open { display: flex; }
  .dd-search {
    border: none; border-bottom: 1px solid var(--border);
    padding: 9px 12px; background: transparent; color: var(--text);
    font-family: var(--font-ui); font-size: 13px; outline: none;
  }
  .dd-search::placeholder { color: var(--text-faint); }
  .dd-list { max-height: 320px; overflow-y: auto; padding: 4px; }
  .dd-item {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 6px 9px; border-radius: var(--radius-sm); cursor: pointer;
    font-size: 13px; color: var(--text);
  }
  .dd-item:hover { background: var(--bg-hover); }
  .dd-item.selected { background: var(--accent-soft); color: var(--accent-2); }
  .dd-item .dd-item-count { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); font-variant-numeric: tabular-nums; }
  .dd-item.dd-any { color: var(--text-dim); border-bottom: 1px solid var(--border); border-radius: 0; margin-bottom: 4px; padding-bottom: 8px; }
  .dd-item.zero:not(.selected) { opacity: 0.34; }
  .dd-empty { padding: 14px; text-align: center; color: var(--text-faint); font-family: var(--font-mono); font-size: 11px; }

  /* ---------- Editor ---------- */
  .editor { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: var(--topbar-h); flex-shrink: 0;
    display: flex; align-items: stretch;
    background: var(--bg); border-bottom: 1px solid var(--border);
    transition: box-shadow var(--t-med) var(--ease);
  }
  .editor.scrolled .topbar { box-shadow: 0 1px 0 var(--border), 0 6px 12px -8px rgba(0,0,0,0.4); }
  .side-toggle {
    width: 40px; flex-shrink: 0; border: none; background: none; cursor: pointer;
    color: var(--text-faint); display: none; align-items: center; justify-content: center;
  }
  .side-toggle:hover { color: var(--text); }
  .side-toggle svg { width: 18px; height: 18px; }

  .tabs { display: flex; align-items: stretch; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
  .tabs::-webkit-scrollbar { height: 0; }
  .tab {
    display: flex; align-items: center; gap: 7px;
    padding: 0 10px 0 13px; border-right: 1px solid var(--border);
    font-size: 12px; color: var(--text-dim); white-space: nowrap;
    background: var(--bg); position: relative;
  }
  .tab:not(.tab-empty) { background: var(--bg-elev); color: var(--text); }
  .tab:not(.tab-empty)::before {
    content: ""; position: absolute; top: 0; left: 0; right: 0; height: 2px; background: var(--accent);
  }
  .tab-empty { color: var(--text-faint); font-style: normal; }
  .tab-dot { width: 9px; height: 9px; border-radius: 2px; box-shadow: inset 0 0 0 1px rgba(127,127,127,0.25); }
  .tab-label { font-family: var(--font-mono); font-size: 12px; }
  .tab-x {
    width: 16px; height: 16px; border: none; background: none; cursor: pointer;
    color: var(--text-faint); border-radius: 3px; font-size: 14px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center;
  }
  .tab-x:hover { background: var(--bg-hover); color: var(--text); }

  .find {
    display: flex; align-items: center; gap: 8px; flex-shrink: 0;
    padding: 0 12px; border-left: 1px solid var(--border); position: relative;
    min-width: 230px; width: 320px; max-width: 38vw;
  }
  .find svg { width: 14px; height: 14px; color: var(--text-faint); flex-shrink: 0; }
  .find input {
    flex: 1; min-width: 0; background: none; border: none; outline: none;
    color: var(--text); font-family: var(--font-ui); font-size: 13px; padding: 0;
  }
  .find input::placeholder { color: var(--text-faint); }
  .kbd {
    font-family: var(--font-mono); font-size: 10px; color: var(--text-faint);
    border: 1px solid var(--border-2); border-radius: 4px; padding: 1px 5px; flex-shrink: 0;
  }

  main {
    flex: 1; overflow-y: auto; min-height: 0;
    padding: 16px clamp(14px, 2.2vw, 28px) 60px;
    scroll-behavior: smooth;
  }
  #grid { display: flex; align-items: flex-start; gap: var(--gap-col, 18px); }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: var(--gap-row, 18px); }

  .card {
    appearance: none; background: none; border: none; margin: 0; padding: 0;
    font: inherit; color: inherit; text-align: left; width: 100%;
    display: flex; flex-direction: column; cursor: pointer;
    contain: layout paint;
    animation: card-in 320ms var(--ease) both;
  }
  .card.plain { animation: card-fade var(--t-med) var(--ease) both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes card-fade { from { opacity: 0; } to { opacity: 1; } }

  .frame {
    position: relative; background: var(--bg-elev);
    border: 1px solid var(--border); border-radius: var(--radius);
    overflow: hidden;
    transition: border-color var(--t-med) var(--ease), transform var(--t-med) var(--ease);
  }
  .card:hover .frame { border-color: var(--border-2); transform: translateY(-2px); }
  .card:hover .frame { box-shadow: var(--shadow); }
  .card:focus-visible { outline: none; }
  .card:focus-visible .frame { outline: 2px solid var(--accent); outline-offset: 2px; border-color: var(--accent); }

  .shot { position: relative; overflow: hidden; background: var(--bg-hover); }
  .shot img, .shot video {
    width: 100%; height: 100%; object-fit: cover; display: block;
    opacity: 0; transition: opacity var(--t-img) var(--ease);
  }
  .shot img.loaded, .shot video.loaded { opacity: 1; }
  .card:hover .shot img.loaded, .card:hover .shot video.loaded { transform: scale(1.03); transition: transform var(--t-img) var(--ease); }

  .strip { position: absolute; left: 0; right: 0; bottom: 0; height: 3px; display: flex; z-index: 2; }
  .strip .sw { flex: 1 1 0; }

  .tag {
    position: absolute; top: 6px; z-index: 3;
    font-family: var(--font-mono); font-size: 9px; text-transform: uppercase; letter-spacing: 0.06em;
    color: #fff; padding: 2px 6px; border-radius: 4px;
    background: rgba(1,4,9,0.62);
  }
  .tag.badge { left: 6px; opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .card:hover .tag.badge, .card:focus-visible .tag.badge { opacity: 1; }
  .tag.live { right: 6px; background: var(--accent); color: #fff; }

  .caption { padding: 8px 2px 0; min-height: 46px; }
  .cap-title { font-size: 13px; line-height: 1.3; color: var(--text); font-weight: 500;
    overflow: hidden; text-overflow: ellipsis; display: -webkit-box; -webkit-line-clamp: 1; -webkit-box-orient: vertical; }
  .cap-spec { margin-top: 2px; font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint);
    font-variant-numeric: tabular-nums; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  .empty { width: 100%; padding: 80px 20px; text-align: center; color: var(--text-dim); }
  .empty .big { font-size: 16px; color: var(--text); margin-bottom: 8px; font-weight: 600; }
  .empty code { font-family: var(--font-mono); background: var(--bg-elev); border: 1px solid var(--border);
    padding: 2px 7px; border-radius: 4px; color: var(--text); }
  .sentinel { height: 1px; width: 100%; }

  /* ---------- Status bar ---------- */
  .statusbar {
    height: var(--status-h); flex-shrink: 0;
    display: flex; align-items: center; gap: 0;
    background: var(--bg-side); border-top: 1px solid var(--border);
    font-family: var(--font-mono); font-size: 11px; color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .statusbar .seg { display: inline-flex; align-items: center; gap: 6px; padding: 0 11px; height: 100%; }
  .statusbar .seg.count { padding-left: 14px; }
  .statusbar .divv { width: 1px; height: 14px; background: var(--border); }
  .statusbar .sp { flex: 1; }
  .statusbar .filt { color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .statusbar button.seg { border: none; background: none; cursor: pointer; color: var(--text-dim); font: inherit; }
  .statusbar button.seg:hover { color: var(--text); background: var(--bg-hover); }
  .statusbar .seg.count b { color: var(--text); font-weight: 600; }

  /* ---------- Scrim (mobile drawer) ---------- */
  .scrim { display: none; position: fixed; inset: 0; background: rgba(1,4,9,0.5); z-index: 40; }

  /* ---------- Lightbox ---------- */
  .lb { position: fixed; inset: 0; z-index: 100; display: none;
    background: color-mix(in oklab, var(--bg) 86%, transparent);
    backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); }
  .lb.open { display: grid; grid-template-columns: 1fr clamp(300px, 28vw, 380px); }
  .lb-stage { position: relative; min-width: 0; display: flex; align-items: center; justify-content: center; padding: clamp(16px,3vw,48px); }
  .lb-stage img, .lb-stage video {
    max-width: 100%; max-height: 88vh; object-fit: contain;
    border-radius: var(--radius); background: transparent; box-shadow: var(--shadow);
    animation: lb-pop 280ms var(--ease) both;
  }
  @keyframes lb-pop { from { opacity: 0; transform: scale(0.98); } to { opacity: 1; transform: none; } }
  .lb-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    border: none; background: none; cursor: pointer; color: var(--text-faint);
    font-family: var(--font-mono); font-size: 11px; padding: 12px; text-transform: uppercase; letter-spacing: 0.08em;
  }
  .lb-nav:hover { color: var(--text); }
  .lb-nav[disabled] { opacity: 0; pointer-events: none; }
  .lb-prev { left: 4px; } .lb-next { right: 4px; }

  .lb-side {
    background: var(--bg-elev); border-left: 1px solid var(--border);
    overflow-y: auto; display: flex; flex-direction: column;
  }
  .lb-head {
    position: sticky; top: 0; z-index: 1; background: var(--bg-elev);
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 14px; border-bottom: 1px solid var(--border);
  }
  .lb-fname { font-family: var(--font-mono); font-size: 12px; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .lb-close { border: none; background: none; cursor: pointer; color: var(--text-faint);
    font-family: var(--font-mono); font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; flex-shrink: 0; }
  .lb-close:hover { color: var(--text); }
  .lb-body { padding: 16px 16px 20px; display: flex; flex-direction: column; gap: 18px; }
  .lb-anim > * { animation: side-in 300ms var(--ease) both; }
  @keyframes side-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .lb-title { font-size: 17px; font-weight: 600; line-height: 1.25; color: var(--text); word-break: break-word; }
  .lb-desc { color: var(--text-dim); font-size: 13px; line-height: 1.55; }

  .lb-sec-label { font-family: var(--font-mono); font-size: 10px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--text-faint); margin-bottom: 9px; }
  .ledger { margin: 0; display: flex; flex-direction: column; border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
  .ledger .row { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; padding: 7px 11px; }
  .ledger .row:nth-child(even) { background: color-mix(in oklab, var(--text) 3%, transparent); }
  .ledger dt { font-family: var(--font-mono); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); }
  .ledger dd { margin: 0; text-align: right; font-family: var(--font-mono); font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; word-break: break-word; }

  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .pill { font-family: var(--font-mono); font-size: 11px; padding: 2px 8px; border: 1px solid var(--border); border-radius: 999px; color: var(--text-dim); }

  .palette { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .palette .p { appearance: none; border: none; padding: 0; font: inherit;
    aspect-ratio: 1; border-radius: var(--radius-sm); cursor: pointer; position: relative;
    box-shadow: inset 0 0 0 1px rgba(127,127,127,0.2); transition: transform var(--t-fast) var(--ease), box-shadow var(--t-fast) var(--ease); }
  .palette .p:hover { transform: translateY(-1px); }
  .palette .p.copied { box-shadow: inset 0 0 0 1px var(--accent), 0 0 0 2px var(--accent-soft); }
  .copy-note { margin-top: 9px; min-height: 14px; font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); opacity: 0; transition: opacity var(--t-fast) var(--ease); }
  .copy-note.show { opacity: 1; }

  .lb-actions { display: flex; gap: 8px; margin-top: 4px; }
  .btn {
    flex: 1; text-align: center; padding: 8px 12px; border-radius: var(--radius);
    font-family: var(--font-mono); font-size: 12px; cursor: pointer;
    border: 1px solid var(--border-2); background: var(--bg-hover); color: var(--text);
    transition: border-color var(--t-fast) var(--ease), background var(--t-fast) var(--ease);
  }
  .btn:hover { border-color: var(--text-faint); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.primary:hover { filter: brightness(1.08); }

  /* ---------- Loader ---------- */
  .loader { position: fixed; inset: 0; z-index: 200; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 16px; background: var(--bg);
    transition: opacity 320ms var(--ease), visibility 320ms var(--ease); }
  .loader.hidden { opacity: 0; visibility: hidden; pointer-events: none; }
  .loader-mark { font-family: var(--font-mono); font-size: 13px; color: var(--text-dim); letter-spacing: 0.04em; }
  .loader-mark b { color: var(--text); }
  .loader-bar { width: 200px; height: 2px; background: var(--border); border-radius: 2px; overflow: hidden; }
  .loader-bar span { display: block; height: 100%; width: 40%; background: var(--accent); border-radius: 2px;
    animation: indet 1.1s var(--ease) infinite; }
  @keyframes indet { 0% { transform: translateX(-120%); } 100% { transform: translateX(320%); } }

  ::-webkit-scrollbar { width: 12px; height: 12px; }
  ::-webkit-scrollbar-thumb { background: var(--border-2); border-radius: 8px; border: 3px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: var(--text-faint); background-clip: padding-box; }
  * { scrollbar-width: thin; scrollbar-color: var(--border-2) transparent; }

  /* ---------- Responsive ---------- */
  @media (max-width: 860px) {
    .activity { display: none; }
    .side-toggle { display: flex; }
    .sidebar { position: fixed; top: 0; bottom: var(--status-h); left: 0; z-index: 50;
      box-shadow: var(--shadow); }
    .app:not(.side-open) .sidebar { display: flex; transform: translateX(-100%); }
    .app.side-open .scrim { display: block; }
    .find { width: auto; min-width: 0; flex: 1; }

  }
  @media (max-width: 560px) {
    .lb.open { grid-template-columns: 1fr; grid-template-rows: minmax(0, 42dvh) 1fr; }
    .lb-side { border-left: none; border-top: 1px solid var(--border); }
    .lb-stage { padding: 12px; } .lb-stage img, .lb-stage video { max-height: 40dvh; }
    .lb-nav { display: none; }
    .palette { grid-template-columns: repeat(6, 1fr); }
    .statusbar .filt, .statusbar .seg.utf { display: none; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 110ms !important; }
    .shot img, .shot video { transition: opacity 120ms linear; }
    .card:hover .shot img.loaded, .card:hover .shot video.loaded { transform: none; }
    .loader-bar span { animation: none; width: 100%; }
  }
</style>
</head>
<body>

<template id="ico-folder"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"><path d="M3 5h6l2 2h10v11H3z"/></svg></template>

<div id="loading" class="loader">
  <div class="loader-mark">indexing <b id="loader-n">wallpapers</b></div>
  <div class="loader-bar"><span></span></div>
</div>

<div class="app" id="app">

    </button>

  <aside class="sidebar" id="sidebar">

  <div class="editor" id="editor">
    <div class="topbar">
      <button class="side-toggle" id="sideToggle" title="Toggle explorer" aria-label="Toggle explorer">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>

        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search wallpapers" aria-label="Search title, theme, tags, path" aria-keyshortcuts="/">

</div>

<footer class="statusbar" id="statusbar">
  <span class="seg count" id="count">indexing</span>
  <span class="seg filt" id="statusFilters"></span>
  <span class="sp"></span>
  <span class="seg utf">UTF-8</span>
  <span class="divv"></span>
  <button class="seg" id="themeBtn" type="button" title="Toggle theme">theme</button>
</footer>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Wallpaper detail">
  <div class="lb-stage">
    <button class="lb-nav lb-prev" id="lbprev" type="button" aria-label="Previous (left arrow)" aria-keyshortcuts="ArrowLeft">&lsaquo; prev</button>
    <button class="lb-nav lb-next" id="lbnext" type="button" aria-label="Next (right arrow)" aria-keyshortcuts="ArrowRight">next &rsaquo;</button>
  </div>
  <aside class="lb-side">
    <div class="lb-head">
      <span class="lb-fname" id="lbfname"></span>
      <button class="lb-close" id="lbclose" title="Close (esc)" aria-keyshortcuts="Escape">close</button>
    </div>
    <div class="lb-body" id="lbside"></div>
  </aside>
</div>

<script src="wallpapers.js"></script>
<script src="live.js"></script>
<script>
const COLOR_DOTS = {
  red:'var(--dot-red)', orange:'var(--dot-orange)', yellow:'var(--dot-yellow)', green:'var(--dot-green)',
  cyan:'var(--dot-cyan)', blue:'var(--dot-blue)', purple:'var(--dot-purple)', pink:'var(--dot-pink)', monochrome:'var(--dot-monochrome)',
};
const VIDEO_RE = /\.(mp4|webm|mov)$/i;
const GRID_MAX_AR = 21 / 9;
const REDUCE_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const STATE = {
  entries: [], byPath: {}, filtered: [],
  filters: { tone: null, color: null, scheme: null, theme: null, resolution: null, q: '' },
  facetCounts: {}, treeCounts: { tone: {}, toneColor: {} },
  rendered: 0, pageSize: 80,
  cols: [], colHeights: [], columnCount: 0,
  didInitialReveal: false, lbIndex: -1, lbReturnFocus: null,
  ddPaint: [],
};
const FILTER_KEYS = ['tone','color','scheme','theme','resolution'];

function readUrl() {
  const sp = new URLSearchParams(location.search);
  for (const k of FILTER_KEYS) STATE.filters[k] = sp.get(k) || null;
  STATE.filters.q = sp.get('q') || '';
}
function buildUrl({ withHash = true } = {}) {
  const sp = new URLSearchParams();
  for (const k of FILTER_KEYS) if (STATE.filters[k]) sp.set(k, STATE.filters[k]);
  if (STATE.filters.q) sp.set('q', STATE.filters.q);
  const qs = sp.toString();
  const hash = withHash ? location.hash : '';
  return location.pathname + (qs ? '?' + qs : '') + hash;
}
function writeUrl() { history.replaceState(null, '', buildUrl()); }
function encodePath(p) { return p.split('/').map(encodeURIComponent).join('/'); }
function decodeHashPath() {
  if (!location.hash) return null;
  try { return decodeURIComponent(location.hash.slice(1)); } catch { return null; }
}

const $ = (s) => document.querySelector(s);
const grid = $('#grid');
const mainEl = $('#main');
const editorEl = $('#editor');
const treeEl = $('#tree');
const filtersEl = $('#filters');
const tabsEl = $('#tabs');
const countEl = $('#count');
const statusFiltersEl = $('#statusFilters');
const searchInput = $('#q');

function el(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}
function debounce(fn, ms) { let t; return (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); }; }
function parseRes(path) { const n = path.split('/').pop(); const m = n.match(/^(\d+)x(\d+)_/); return m ? `${m[1]}x${m[2]}` : ''; }
function resOf(path, m) { if (m && m.width && m.height) return `${m.width}x${m.height}`; return parseRes(path); }
function dimsOf(path, m) {
  if (m && m.width && m.height) return [m.width, m.height];
  const r = parseRes(path); if (!r) return [null, null];
  const [w, h] = r.split('x').map(Number); return [w, h];
}
const RES_TIERS = ['<=720p','720p','1080p','1440p','4K','5K','8K+'];
function bucketRes(w) {
  if (!w) return null;
  if (w >= 7000) return '8K+'; if (w >= 4800) return '5K'; if (w >= 3500) return '4K';
  if (w >= 2500) return '1440p'; if (w >= 1900) return '1080p'; if (w >= 1200) return '720p'; return '<=720p';
}
function fmtBytes(n) {
  if (!n || n <= 0) return ''; const u = ['B','KB','MB','GB']; let i = 0, v = n;
  while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
  return `${v < 10 ? v.toFixed(1) : Math.round(v)} ${u[i]}`;
}
const MEDIA_BASE = (window.WALLPAPERS_BASE_URL || '').replace(/\/+$/, '');
function mediaUrl(p) {
  if (!p) return p;
  if (/^(https?:|data:|blob:)/i.test(p)) return p;
  return MEDIA_BASE ? `${MEDIA_BASE}/${p.replace(/^\/+/, '')}` : p;
}
function fileName(p) { return p.split('/').pop(); }

async function load() {
  if (!window.WALLPAPERS) throw new Error('wallpapers.js did not load');
  const data = window.WALLPAPERS;
  const live = window.LIVE || {};
  const merged = { ...data, ...live };
  for (const [path, m] of Object.entries(merged)) {
    const [w] = dimsOf(path, m);
    m._resTier = bucketRes(w);
  }
  STATE.entries = Object.entries(merged);
  STATE.byPath = merged;

  const ln = $('#loader-n');
  if (ln) ln.textContent = STATE.entries.length.toLocaleString() + ' wallpapers';

  readUrl();
  searchInput.value = STATE.filters.q || '';
  buildTree();
  buildFilterControls();
  document.getElementById('app').classList.toggle('side-open', window.innerWidth >= 860);
  applyFilters({ writeUrl: false });
  updateThemeBtn();

  const hashPath = decodeHashPath();
  if (hashPath && STATE.byPath[hashPath]) openLightbox(hashPath, STATE.byPath[hashPath], { push: false });
}

/* ---------- Facets ---------- */
function inc(m, k) { if (!k) return; m.set(k, (m.get(k) || 0) + 1); }
function sortedKeys(m) { return [...m.entries()].sort((a,b) => b[1] - a[1]).map(([k]) => k); }
function facetField(m, key) { return key === 'resolution' ? m._resTier : m[key]; }

function matchesQ(path, m, q) {
  if (!q) return true;
  const hay = (path + ' ' + (m.title||'') + ' ' + (m.description||'') + ' ' + (m.tags||[]).join(' ')).toLowerCase();
  return hay.includes(q);
}

function computeFacetCounts() {
  const f = STATE.filters, q = f.q.trim().toLowerCase();
  const out = { tone: {}, color: {}, scheme: {}, theme: {}, resolution: {} };
  for (const [path, m] of STATE.entries) {
    if (!matchesQ(path, m, q)) continue;
    for (const k of FILTER_KEYS) {
      let match = true;
      for (const k2 of FILTER_KEYS) {
        if (k2 === k) continue;
        if (f[k2] && facetField(m, k2) !== f[k2]) { match = false; break; }
      }
      if (!match) continue;
      const v = facetField(m, k);
      if (!v) continue;
      out[k][v] = (out[k][v] || 0) + 1;
    }
  }
  return out;
}

// Tree counts honor the FORM filters (resolution/scheme/theme) + search, but not tone/color
function computeTreeCounts() {
  const f = STATE.filters, q = f.q.trim().toLowerCase();
  const tone = {}, toneColor = {};
  for (const [path, m] of STATE.entries) {
    if (f.resolution && m._resTier !== f.resolution) continue;
    if (f.scheme && m.scheme !== f.scheme) continue;
    if (f.theme && m.theme !== f.theme) continue;
    if (!matchesQ(path, m, q)) continue;
    if (!m.tone) continue;
    tone[m.tone] = (tone[m.tone] || 0) + 1;
    if (m.color) {
      if (!toneColor[m.tone]) toneColor[m.tone] = {};
      toneColor[m.tone][m.color] = (toneColor[m.tone][m.color] || 0) + 1;
    }
  }
  return { tone, toneColor };
}

/* ---------- Sidebar tree ---------- */
const FOLDER_TPL = document.getElementById('ico-folder');
function buildTree() {
  const tones = new Map();
  for (const [, m] of STATE.entries) {
    if (!m.tone) continue;
    if (!tones.has(m.tone)) tones.set(m.tone, new Set());
    if (m.color) tones.get(m.tone).add(m.color);
  }
  const toneOrder = ['dark','light','live'].filter(t => tones.has(t));
  const colorOrder = ['monochrome','red','orange','yellow','green','cyan','blue','purple','pink'];

  treeEl.replaceChildren();
  for (const tone of toneOrder) {
    const colors = colorOrder.filter(c => tones.get(tone).has(c));

    const folder = el('div', 'tree-folder');
    folder.dataset.tone = tone;
    const caret = el('span', 'tree-caret', colors.length ? '▾' : '');
    const ico = el('span', 'tree-ico'); if (FOLDER_TPL) ico.appendChild(FOLDER_TPL.content.cloneNode(true));
    const name = el('span', 'tree-name', tone);
    const count = el('span', 'tree-count');
    folder.append(caret, ico, name, count);
    folder.addEventListener('click', () => setTone(tone));
    treeEl.appendChild(folder);

    const kids = el('div', 'tree-kids');
    for (const c of colors) {
      const leaf = el('div', 'tree-leaf');
      leaf.dataset.tone = tone; leaf.dataset.color = c;
      const dot = el('span', 'tree-dot'); dot.style.background = COLOR_DOTS[c] || 'var(--text-faint)';
      const nm = el('span', 'tree-name', c);
      const ct = el('span', 'tree-count');
      leaf.append(dot, nm, ct);
      leaf.addEventListener('click', (e) => { e.stopPropagation(); setToneColor(tone, c); });
      kids.appendChild(leaf);
    }
    treeEl.appendChild(kids);
    if (colors.length) {
      caret.addEventListener('click', (e) => { e.stopPropagation(); folder.classList.toggle('collapsed'); kids.classList.toggle('hidden'); });
    }
  }
}
function setTone(t) { STATE.filters.tone = STATE.filters.tone === t ? null : t; applyFilters(); }
function setToneColor(t, c) {
  if (STATE.filters.tone === t && STATE.filters.color === c) { STATE.filters.color = null; }
  else { STATE.filters.tone = t; STATE.filters.color = c; }
  applyFilters();
}
function refreshTree() {
  const tc = STATE.treeCounts;
  for (const folder of treeEl.querySelectorAll('.tree-folder')) {
    const t = folder.dataset.tone, n = tc.tone[t] || 0;
    folder.querySelector('.tree-count').textContent = n.toLocaleString();
    folder.classList.toggle('active', STATE.filters.tone === t && !STATE.filters.color);
    folder.classList.toggle('zero', n === 0);
  }
  for (const leaf of treeEl.querySelectorAll('.tree-leaf')) {
    const t = leaf.dataset.tone, c = leaf.dataset.color;
    const n = (tc.toneColor[t] || {})[c] || 0;
    leaf.querySelector('.tree-count').textContent = n.toLocaleString();
    const active = STATE.filters.tone === t && STATE.filters.color === c;
    leaf.classList.toggle('active', active);
    leaf.classList.toggle('zero', n === 0 && !active);
  }
}

/* ---------- FILTERS dropdowns (resolution / scheme / theme) ---------- */
function buildFilterControls() {
  const schemes = new Map(), themes = new Map(), resolutions = new Map();
  for (const [, m] of STATE.entries) { inc(schemes, m.scheme); inc(themes, m.theme); inc(resolutions, m._resTier); }
  filtersEl.replaceChildren();
  STATE.ddPaint = [];
  filtersEl.appendChild(dropdownEl('resolution', resolutions, RES_TIERS.filter(t => resolutions.has(t))));
  filtersEl.appendChild(dropdownEl('scheme', schemes));
  filtersEl.appendChild(dropdownEl('theme', themes));
}

function dropdownEl(filterKey, counts, orderedItems) {
  const items = orderedItems || sortedKeys(counts);
  const wrap = el('div', 'dd');

  const btn = el('button', 'dd-btn');
  btn.type = 'button';
  btn.setAttribute('aria-haspopup', 'listbox');
  btn.setAttribute('aria-expanded', 'false');
  const lab = el('span', 'dd-label', filterKey);
  const val = el('span', 'dd-val', 'all');
  const caret = el('span', 'dd-caret', '▾');
  btn.append(lab, val, caret);

  const menu = el('div', 'dd-menu');
  const search = document.createElement('input');
  search.type = 'search'; search.className = 'dd-search'; search.placeholder = `Filter ${filterKey}...`;
  const list = el('div', 'dd-list');
  menu.append(search, list);

  function refresh(query = '') {
    list.replaceChildren();
    const q = query.trim().toLowerCase();
    const anyItem = el('div', 'dd-item dd-any', `any ${filterKey}`);
    anyItem.addEventListener('click', () => { STATE.filters[filterKey] = null; close(); applyFilters(); });
    list.appendChild(anyItem);
    const live = STATE.facetCounts[filterKey] || {};
    const filtered = items.filter(k => !q || k.toLowerCase().includes(q));
    if (!filtered.length) { list.appendChild(el('div', 'dd-empty', 'no matches')); return; }
    for (const k of filtered) {
      const c = live[k] || 0;
      const item = el('div', 'dd-item');
      if (STATE.filters[filterKey] === k) item.classList.add('selected');
      if (c === 0) item.classList.add('zero');
      item.appendChild(el('span', null, k));
      item.appendChild(el('span', 'dd-item-count', String(c)));
      item.addEventListener('click', () => { STATE.filters[filterKey] = k; close(); applyFilters(); });
      list.appendChild(item);
    }
  }
  function paintBtn() {
    const cur = STATE.filters[filterKey];
    if (cur) { btn.classList.add('active'); val.textContent = cur; }
    else { btn.classList.remove('active'); val.textContent = 'all'; }
  }
  function open() {
    document.querySelectorAll('.dd-menu.open').forEach(m => { if (m !== menu) { m.classList.remove('open'); const b = m.parentNode.querySelector('.dd-btn'); if (b) b.setAttribute('aria-expanded','false'); } });
    menu.classList.add('open'); btn.setAttribute('aria-expanded', 'true');
    refresh(search.value); setTimeout(() => search.focus(), 0);
  }
  function close() { menu.classList.remove('open'); btn.setAttribute('aria-expanded', 'false'); }

  btn.addEventListener('click', (e) => { e.stopPropagation(); menu.classList.contains('open') ? close() : open(); });
  menu.addEventListener('click', (e) => e.stopPropagation());
  search.addEventListener('input', () => refresh(search.value));
  search.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') close();
    if (e.key === 'Enter') { const first = list.querySelector('.dd-item:not(.dd-any)'); if (first) first.click(); }
  });

  wrap.append(btn, menu);
  paintBtn();
  STATE.ddPaint.push(paintBtn);
  return wrap;
}
document.addEventListener('pointerdown', (e) => {
  if (!e.target.closest('.dd')) document.querySelectorAll('.dd-menu.open').forEach(m => {
    m.classList.remove('open'); const b = m.parentNode.querySelector('.dd-btn'); if (b) b.setAttribute('aria-expanded','false');
  });
});

/* ---------- Tabs (active filters) ---------- */
function buildTabs() {
  tabsEl.replaceChildren();
  const f = STATE.filters;
  const tabs = [];
  if (f.tone) tabs.push(['tone', f.tone + '/', null]);
  if (f.color) tabs.push(['color', f.color, f.color]);
  if (f.resolution) tabs.push(['resolution', f.resolution, null]);
  if (f.scheme) tabs.push(['scheme', f.scheme, null]);
  if (f.theme) tabs.push(['theme', f.theme, null]);
  if (f.q.trim()) tabs.push(['q', '"' + f.q.trim() + '"', null]);
  if (!tabs.length) {
    const t = el('div', 'tab tab-empty');
    t.appendChild(el('span', 'tab-label', 'all wallpapers'));
    tabsEl.appendChild(t);
    return;
  }
  for (const [key, label, dot] of tabs) {
    const tab = el('div', 'tab');
    if (dot) { const d = el('span', 'tab-dot'); d.style.background = COLOR_DOTS[dot] || ''; tab.appendChild(d); }
    tab.appendChild(el('span', 'tab-label', label));
    const x = el('button', 'tab-x', '×'); x.type = 'button'; x.title = 'close';
    x.setAttribute('aria-label', 'clear ' + key);
    x.addEventListener('click', () => clearFilter(key));
    tab.appendChild(x);
    tabsEl.appendChild(tab);
  }
}
function clearFilter(key) {
  if (key === 'q') { STATE.filters.q = ''; searchInput.value = ''; }
  else STATE.filters[key] = null;
  applyFilters();
}

/* ---------- Status ---------- */
function anyFilterActive() { return FILTER_KEYS.some(k => STATE.filters[k]) || !!STATE.filters.q.trim(); }
function refreshStatus() {
  const total = STATE.entries.length, shown = STATE.filtered.length;
  countEl.replaceChildren(el('b', null, shown.toLocaleString()), document.createTextNode(' / ' + total.toLocaleString()));
  const f = STATE.filters, parts = [];
  if (f.tone) parts.push(f.tone);
  if (f.color) parts.push(f.color);
  if (f.resolution) parts.push(f.resolution);
  if (f.scheme) parts.push(f.scheme);
  if (f.theme) parts.push(f.theme);
  statusFiltersEl.textContent = parts.length ? parts.join('  ·  ') : '';
}

function refreshChrome() {
  refreshTree();
  STATE.ddPaint.forEach(fn => fn());
  buildTabs();
  refreshStatus();
}

/* ---------- Apply ---------- */
function applyFilters(opts = {}) {
  const f = STATE.filters, q = f.q.trim().toLowerCase();
  STATE.filtered = STATE.entries.filter(([path, m]) => {
    if (f.tone && m.tone !== f.tone) return false;
    if (f.color && m.color !== f.color) return false;
    if (f.scheme && m.scheme !== f.scheme) return false;
    if (f.theme && m.theme !== f.theme) return false;
    if (f.resolution && m._resTier !== f.resolution) return false;
    return matchesQ(path, m, q);
  });
  STATE.rendered = 0;
  layoutColumns();
  renderMore();
  STATE.facetCounts = computeFacetCounts();
  STATE.treeCounts = computeTreeCounts();
  refreshChrome();
  if (STATE.didInitialReveal && !REDUCE_MOTION && STATE.filtered.length) {
    grid.animate([{ opacity: 0.45 }, { opacity: 1 }], { duration: 160, easing: 'ease-out' });
  }
  if (opts.writeUrl !== false) writeUrl();
}

/* ---------- Masonry ---------- */
function metrics() {
  const w = window.innerWidth;
  if (w < 560)  return { colMin: 150, gapCol: 12, captionH: 46 };
  if (w < 900)  return { colMin: 200, gapCol: 16, captionH: 46 };
  if (w < 1400) return { colMin: 240, gapCol: 18, captionH: 46 };
  return { colMin: 280, gapCol: 18, captionH: 46 };
}
function computeColumnCount() {
  const { colMin, gapCol } = metrics();
  const w = grid.clientWidth || mainEl.clientWidth || window.innerWidth;
  return Math.max(1, Math.min(6, Math.floor((w + gapCol) / (colMin + gapCol))));
}
function colWidth() {
  const { gapCol } = metrics(); const n = STATE.columnCount || 1;
  const w = grid.clientWidth || mainEl.clientWidth || window.innerWidth;
  return (w - gapCol * (n - 1)) / n;
}
function applyGapVars() {
  const { gapCol } = metrics();
  document.documentElement.style.setProperty('--gap-col', gapCol + 'px');
  document.documentElement.style.setProperty('--gap-row', gapCol + 'px');
}
function layoutColumns() {
  applyGapVars();
  const n = computeColumnCount();
  STATE.columnCount = n;
  STATE.cols = []; STATE.colHeights = new Array(n).fill(0);
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) { const c = el('div', 'col'); STATE.cols.push(c); frag.appendChild(c); }
  grid.replaceChildren(frag);
}
function shortestCol() { let mi = 0; for (let i = 1; i < STATE.colHeights.length; i++) if (STATE.colHeights[i] < STATE.colHeights[mi]) mi = i; return mi; }
function gridAr(path, m) {
  const [w, h] = dimsOf(path, m);
  if (!w || !h) return 1.6;
  return Math.min(Math.max(w / h, 0.5), GRID_MAX_AR);
}

let sentinel = null;
function ensureSentinel(active) {
  if (active) {
    if (!sentinel) sentinel = el('div', 'sentinel');
    if (sentinel.parentNode !== mainEl) mainEl.appendChild(sentinel);
    sentinelIo.disconnect(); sentinelIo.observe(sentinel);
  } else {
    sentinelIo.disconnect();
    if (sentinel && sentinel.parentNode) sentinel.parentNode.removeChild(sentinel);
  }
}
function renderMore() {
  ensureSentinel(false);
  if (STATE.filtered.length === 0) {
    const empty = el('div', 'empty');
    empty.appendChild(el('div', 'big', 'No matches'));
    empty.appendChild(el('div', null, 'No wallpapers match this combination. Clear a tab to widen the search.'));
    grid.replaceChildren(empty);
    return;
  }
  const start = STATE.rendered;
  const stagger = start === 0 && !STATE.didInitialReveal && !REDUCE_MOTION;
  const end = Math.min(STATE.filtered.length, start + STATE.pageSize);
  const cw = colWidth(); const { captionH } = metrics();
  for (let i = start; i < end; i++) {
    const entry = STATE.filtered[i];
    const ar = gridAr(entry[0], entry[1]);
    const card = cardEl(entry, i, ar);
    if (stagger) card.style.animationDelay = Math.min((i - start) * 18, 720) + 'ms';
    else if (start > 0) card.classList.add('plain');
    const ci = shortestCol();
    STATE.cols[ci].appendChild(card);
    STATE.colHeights[ci] += (cw / ar) + captionH + (metrics().gapCol);
  }
  STATE.rendered = end;
  if (stagger) STATE.didInitialReveal = true;
  ensureSentinel(end < STATE.filtered.length);
}
function reflow() {
  const n = computeColumnCount();
  if (n === STATE.columnCount) return;
  const cards = [...grid.querySelectorAll('.card')];
  applyGapVars();
  STATE.columnCount = n; STATE.cols = []; STATE.colHeights = new Array(n).fill(0);
  const frag = document.createDocumentFragment();
  for (let i = 0; i < n; i++) { const c = el('div', 'col'); STATE.cols.push(c); frag.appendChild(c); }
  const cw = colWidth(); const { captionH, gapCol } = metrics();
  for (const card of cards) {
    card.style.animation = 'none';
    const ar = parseFloat(card.dataset.ar) || 1.6;
    const ci = shortestCol();
    STATE.cols[ci].appendChild(card);
    STATE.colHeights[ci] += (cw / ar) + captionH + gapCol;
  }
  grid.replaceChildren(frag);
}
window.addEventListener('resize', debounce(reflow, 160));

const io = new IntersectionObserver((entries) => {
  for (const e of entries) {
    if (e.isIntersecting && e.target.dataset.src) {
      const img = e.target; img.src = img.dataset.src; img.removeAttribute('data-src'); io.unobserve(img);
    }
  }
}, { root: mainEl, rootMargin: '400px' });
const sentinelIo = new IntersectionObserver((entries) => { if (entries[0].isIntersecting) renderMore(); }, { root: mainEl, rootMargin: '700px' });

/* ---------- Card ---------- */
function cardEl([path, m], index, ar) {
  const card = el('button', 'card'); card.type = 'button'; card.dataset.ar = String(ar);
  card.setAttribute('aria-label', (m.title || fileName(path)) + ' — open');

  const frame = el('div', 'frame');
  const shot = el('div', 'shot'); shot.style.aspectRatio = String(ar);

  const isVideo = VIDEO_RE.test(path);
  let media;
  if (isVideo) {
    media = document.createElement('video');
    media.muted = true; media.loop = true; media.playsInline = true; media.preload = 'metadata';
    media.dataset.src = mediaUrl(path);
    media.addEventListener('loadeddata', () => media.classList.add('loaded'));
    if (!REDUCE_MOTION) {
      card.addEventListener('mouseenter', () => media.play().catch(() => {}));
      card.addEventListener('mouseleave', () => { media.pause(); media.currentTime = 0; });
    }
  } else {
    media = document.createElement('img');
    media.alt = m.title || ''; media.loading = 'lazy'; media.decoding = 'async';
    media.dataset.src = mediaUrl(m.thumb_path || path);
    media.addEventListener('load', () => media.classList.add('loaded'));
  }
  io.observe(media);
  shot.appendChild(media);

  if (m.colors && m.colors.length) {
    const strip = el('div', 'strip');
    m.colors.slice(0, 6).forEach(c => { const s = el('span', 'sw'); s.style.background = c; strip.appendChild(s); });
    shot.appendChild(strip);
  }
  if (isVideo) shot.appendChild(el('div', 'tag live', 'live'));
  const badge = `${m.tone || ''} ${m.color || ''}`.trim();
  if (badge) shot.appendChild(el('div', 'tag badge', badge));

  frame.appendChild(shot);
  card.appendChild(frame);

  const cap = el('div', 'caption');
  cap.appendChild(el('div', 'cap-title', m.title || fileName(path)));
  const bits = [m.color, resOf(path, m), m.scheme && m.scheme !== 'Custom' ? m.scheme : null].filter(Boolean);
  cap.appendChild(el('div', 'cap-spec', bits.join('  ·  ')));
  card.appendChild(cap);

  card.addEventListener('click', () => { STATE.lbReturnFocus = card; openLightbox(path, m, { index }); });
  return card;
}

/* ---------- Lightbox ---------- */
const lb = $('#lb');
const lbSide = $('#lbside');
const lbStage = document.querySelector('.lb-stage');
const lbPrev = $('#lbprev');
const lbNext = $('#lbnext');
const lbClose = $('#lbclose');
const lbFname = $('#lbfname');

function openLightbox(path, m, opts = {}) {
  [...lbStage.querySelectorAll('img, video')].forEach(n => n.remove());
  let media;
  if (VIDEO_RE.test(path)) {
    media = document.createElement('video');
    media.src = mediaUrl(path); media.controls = true; media.loop = true; media.muted = true; media.playsInline = true;
    if (!REDUCE_MOTION) media.autoplay = true;
  } else {
    media = document.createElement('img'); media.src = mediaUrl(m.medium_path || path); media.alt = m.title || path;
  }
  media.id = 'lbimg';
  lbStage.appendChild(media);

  STATE.lbIndex = (typeof opts.index === 'number') ? opts.index : STATE.filtered.findIndex(([p]) => p === path);
  updateNav();
  lbFname.textContent = fileName(path);
  renderSide(path, m);
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
  if (opts.replace !== true) { try { lbClose.focus(); } catch (e) {} }

  if (opts.replace === true) {
    history.replaceState({ lightbox: path }, '', buildUrl({ withHash: false }) + '#' + encodePath(path));
  } else if (opts.push !== false) {
    history.pushState({ lightbox: path }, '', buildUrl({ withHash: false }) + '#' + encodePath(path));
  }
}
function updateNav() {
  const i = STATE.lbIndex, n = STATE.filtered.length;
  lbPrev.disabled = !(i > 0);
  lbNext.disabled = !(i >= 0 && i < n - 1);
}
function navigateLightbox(dir) {
  if (!lb.classList.contains('open')) return;
  const i = STATE.lbIndex + dir;
  if (i < 0 || i >= STATE.filtered.length) return;
  const [p, mm] = STATE.filtered[i];
  openLightbox(p, mm, { index: i, replace: true });
}
function renderSide(path, m) {
  lbSide.replaceChildren();
  const frag = document.createDocumentFragment();
  frag.appendChild(el('div', 'lb-title', m.title || fileName(path)));
  if (m.description) frag.appendChild(el('div', 'lb-desc', m.description));

  const ledger = el('dl', 'ledger');
  const rows = [
    ['path', path], ['res', resOf(path, m)], ['size', fmtBytes(m.size_bytes)],
    ['tone', m.tone], ['color', m.color], ['theme', m.theme], ['scheme', m.scheme],
  ];
  for (const [k, v] of rows) {
    if (!v) continue;
    const row = el('div', 'row'); row.appendChild(el('dt', null, k)); row.appendChild(el('dd', null, v)); ledger.appendChild(row);
  }
  frag.appendChild(ledger);

  if (m.tags && m.tags.length) {
    const sec = el('div'); sec.appendChild(el('div', 'lb-sec-label', 'tags'));
    const w = el('div', 'tags'); m.tags.forEach(t => w.appendChild(el('span', 'pill', t))); sec.appendChild(w); frag.appendChild(sec);
  }
  if (m.colors && m.colors.length) {
    const sec = el('div'); sec.appendChild(el('div', 'lb-sec-label', 'palette — click to copy'));
    const pal = el('div', 'palette'); const note = el('div', 'copy-note');
    note.setAttribute('role', 'status'); note.setAttribute('aria-live', 'polite');
    m.colors.forEach(c => {
      const p = el('button', 'p'); p.type = 'button'; p.style.background = c; p.title = c; p.setAttribute('aria-label', `copy ${c}`);
      p.addEventListener('click', () => {
        if (navigator.clipboard) navigator.clipboard.writeText(c).catch(() => {});
        pal.querySelectorAll('.p.copied').forEach(x => x.classList.remove('copied'));
        p.classList.add('copied'); note.textContent = `copied ${c}`; note.classList.add('show');
        clearTimeout(note._t); note._t = setTimeout(() => { p.classList.remove('copied'); note.classList.remove('show'); }, 1400);
      });
      pal.appendChild(p);
    });
    sec.appendChild(pal); sec.appendChild(note); frag.appendChild(sec);
  }
  const actions = el('div', 'lb-actions');
  const dl = el('a', 'btn', 'download'); dl.href = mediaUrl(path); dl.setAttribute('download', '');
  const open = el('a', 'btn primary', 'open full'); open.href = mediaUrl(path); open.target = '_blank'; open.rel = 'noopener';
  actions.append(dl, open); frag.appendChild(actions);

  lbSide.classList.remove('lb-anim');
  lbSide.appendChild(frag);
  if (!REDUCE_MOTION) {
    void lbSide.offsetWidth; lbSide.classList.add('lb-anim');
    const kids = lbSide.children;
    for (let i = 0; i < kids.length; i++) kids[i].style.animationDelay = (i * 32) + 'ms';
  }
}
function closeLightbox(opts = {}) {
  if (!lb.classList.contains('open')) return;
  lb.classList.remove('open');
  [...lbStage.querySelectorAll('img, video')].forEach(n => n.remove());
  document.body.style.overflow = ''; STATE.lbIndex = -1;
  if (STATE.lbReturnFocus && document.contains(STATE.lbReturnFocus)) { try { STATE.lbReturnFocus.focus(); } catch (e) {} }
  STATE.lbReturnFocus = null;
  if (opts.pop !== false && history.state && history.state.lightbox) history.back();
  else if (opts.pop !== false && location.hash) history.replaceState(null, '', buildUrl({ withHash: false }));
}
lbClose.addEventListener('click', () => closeLightbox());
lbPrev.addEventListener('click', () => navigateLightbox(-1));
lbNext.addEventListener('click', () => navigateLightbox(1));
lb.addEventListener('click', (e) => { if (e.target === lb || e.target === lbStage) closeLightbox(); });
document.addEventListener('keydown', (e) => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLightbox();
  else if (e.key === 'ArrowLeft') navigateLightbox(-1);
  else if (e.key === 'ArrowRight') navigateLightbox(1);
});

window.addEventListener('popstate', () => {
  readUrl();
  searchInput.value = STATE.filters.q || '';
  applyFilters({ writeUrl: false });
  const hashPath = decodeHashPath();
  const isOpen = lb.classList.contains('open');
  if (hashPath && STATE.byPath[hashPath]) openLightbox(hashPath, STATE.byPath[hashPath], { push: false });
  else if (isOpen) closeLightbox({ pop: false });
});

/* ---------- Chrome wiring ---------- */
searchInput.addEventListener('input', debounce((e) => { STATE.filters.q = e.target.value; applyFilters(); }, 120));

function resetAll() {
  STATE.filters = { tone: null, color: null, scheme: null, theme: null, resolution: null, q: '' };
  searchInput.value = ''; applyFilters();
}

document.addEventListener('keydown', (e) => {
  const typing = /^(input|textarea)$/i.test(e.target.tagName || '');
  if (lb.classList.contains('open')) return;
  if (e.key === '/' && !typing) { e.preventDefault(); searchInput.focus(); }
  else if ((e.key === 'p' || e.key === 'P') && (e.metaKey || e.ctrlKey)) { e.preventDefault(); searchInput.focus(); searchInput.select(); }
});

function effectiveTheme() {
  return document.documentElement.dataset.theme || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
}
function updateThemeBtn() {
  const cur = effectiveTheme();
  const btn = $('#themeBtn'); if (btn) btn.textContent = cur === 'light' ? 'light' : 'dark';
}
function toggleTheme() {
  const next = effectiveTheme() === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem('wp-theme', next); } catch (e) {}
  updateThemeBtn();
}
$('#themeBtn').addEventListener('click', toggleTheme);
$('#actTheme').addEventListener('click', toggleTheme);
window.matchMedia('(prefers-color-scheme: light)').addEventListener('change', () => { if (!document.documentElement.dataset.theme) updateThemeBtn(); });

function toggleSidebar() { document.getElementById('app').classList.toggle('side-open'); }
$('#sideToggle').addEventListener('click', toggleSidebar);
$('#actExplorer').addEventListener('click', toggleSidebar);
$('#actSearch').addEventListener('click', () => searchInput.focus());
$('#scrim').addEventListener('click', () => document.getElementById('app').classList.remove('side-open'));

let scrolled = -1;
mainEl.addEventListener('scroll', () => {
  const s = mainEl.scrollTop > 4 ? 1 : 0;
  if (s !== scrolled) { editorEl.classList.toggle('scrolled', !!s); scrolled = s; }
}, { passive: true });

/* ---------- Boot ---------- */
function showLoadError(err) {
  layoutColumns();
  const wrap = el('div', 'empty');
  wrap.appendChild(el('div', 'big', 'Could not load the collection'));
  wrap.appendChild(el('div', null, 'wallpapers.js did not load. Rebuild it with build-data.sh.'));
  wrap.appendChild(el('div', null, ' '));
  wrap.appendChild(el('div', null, 'Error: ' + (err && err.message || String(err))));
  grid.replaceChildren(wrap);
}
function hideLoader() { const l = document.getElementById('loading'); if (l) l.classList.add('hidden'); }

updateThemeBtn();
load().then(hideLoader).catch(err => { hideLoader(); showLoadError(err); });

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => { navigator.serviceWorker.register('sw.js').catch(err => console.warn('SW register failed:', err)); });
}
</script>
</body>
</html>
